<style>
:root{--bg:#edf1f3;--card:#fff;--ink:#12232b;--mute:#5d707a;--line:#cbd5da;--jade:#0e7c66;--jade-t:#dff3ee;--seal:#c23b2e;--seal-t:#fbe6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1b21;--card:#17272f;--ink:#e6eef1;--mute:#93a7b0;--line:#2a3e47;--jade:#3cc3a3;--jade-t:#16372f;--seal:#f06b5b;--seal-t:#3a1f1c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font:700 22px/1.2 "Noto Serif SC","Noto Sans Thai",serif;margin:0}
h1 small{font:400 13px "Noto Sans Thai",sans-serif;color:var(--mute);margin-left:8px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mute);padding:10px;border-radius:9px;font:600 15px "Noto Sans Thai",sans-serif;cursor:pointer}
.tabs button.on{background:var(--jade);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:400 14px "Noto Sans Thai",sans-serif;cursor:pointer}
.chips button.on{border-color:var(--jade);background:var(--jade-t);color:var(--jade);font-weight:600}
.opt{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin:4px 0 12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.card::after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;background:var(--seal);border-radius:2px}
.hz{font:700 clamp(56px,20vw,104px)/1.1 "Noto Serif SC","Songti SC","SimSun",serif;word-break:keep-all}
.hz.sm{font-size:clamp(40px,14vw,64px)}
.py{font-size:24px;color:var(--jade);font-weight:600;margin-top:10px}
.th{font-size:20px;margin-top:4px}
.mn{font-size:20px;margin-top:8px;padding:6px 16px;background:var(--seal-t);color:var(--seal);border-radius:10px;font-weight:600}
.ans{transition:opacity .2s,filter .2s}
.card.veil .ans{opacity:0;filter:blur(8px);pointer-events:none}
.card.veil::before{content:"แตะการ์ดเพื่อดูคำตอบ";position:absolute;bottom:18px;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;margin-top:12px}
.row button,.next{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 10px;font:600 16px "Noto Sans Thai",sans-serif;cursor:pointer}
.row button.main,.next{background:var(--jade);border-color:var(--jade);color:#fff}
.row button.on{border-color:var(--jade);color:var(--jade)}
button:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.say{border:0;background:var(--jade-t);color:var(--jade);border-radius:999px;padding:10px 20px;font:600 16px "Noto Sans Thai",sans-serif;cursor:pointer;margin-top:12px}
.q{font-size:15px;color:var(--mute);margin-bottom:8px}
.choices{display:grid;gap:10px;margin-top:12px}
.choices button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font:600 18px "Noto Sans Thai",sans-serif;cursor:pointer;text-align:center}
.choices button.zh{font:700 30px "Noto Serif SC",serif}
.choices button.ok{border-color:var(--jade);background:var(--jade-t);color:var(--jade)}
.choices button.bad{border-color:var(--seal);background:var(--seal-t);color:var(--seal)}
.choices button:disabled{cursor:default}
.score{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.score b{color:var(--ink)}
.next{display:block;width:100%;margin-top:12px}
.fb{margin-top:14px;font-size:15px}
.fb .py{font-size:20px;margin-top:0}
.note{margin-top:22px;color:var(--mute);font-size:13px;text-align:center}
#q{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 16px "Noto Sans Thai",sans-serif;margin-bottom:6px}
#lst h2{font:700 17px "Noto Sans Thai",sans-serif;margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--jade)}
#lst h2 span{font-weight:400;font-size:13px;color:var(--mute);margin-left:6px}
.it{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.it .zh{font:700 26px/1.2 "Noto Serif SC","Songti SC",serif;word-break:keep-all}
.it .p{color:var(--jade);font-weight:600}
.it .t{font-size:14px;color:var(--mute)}
.it button{border:0;background:var(--jade-t);color:var(--jade);border-radius:50%;width:36px;height:36px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ans{transition:none}}
</style>
</head>

  <div class="tabs" role="tablist">

</div>

  const w=cur;
  $('#stage').innerHTML=`
  <label class="opt"><input type="checkbox" id="hide" ${hide?'checked':''}> ทายก่อน แล้วค่อยแตะดูคำตอบ</label>
  <div class="card ${hide&&!shown?'veil':''}" id="card" tabindex="0">
    <div class="hz ${w.h.length>3?'sm':''}">${w.h}</div>
    <div class="ans"><div class="py">${w.p}</div><div class="th">อ่านว่า ${w.t}</div><div class="mn">${w.m}</div></div>
    <button class="say" id="say">▶ ฟังเสียง</button>
  </div>
  <div class="row"><button id="prev" ${hist.length?'':'disabled'}>ย้อนกลับ</button><button id="slow" class="${slow?'on':''}">เสียงช้า</button><button class="main" id="rnd">สุ่มคำ</button></div>`;
  $('#hide').onchange=e=>{hide=e.target.checked;shown=false;renderLearn()};
  $('#card').onclick=e=>{if(e.target.id==='say')return;if(hide&&!shown){shown=true;$('#card').classList.remove('veil')}};
  $('#say').onclick=()=>speak(w.h);
  $('#slow').onclick=()=>{slow=!slow;$('#slow').classList.toggle('on',slow);speak(w.h)};
  $('#prev').onclick=()=>{if(hist.length){cur=hist.pop();shown=false;renderLearn();speak(cur.h)}};
  $('#rnd').onclick=()=>nextWord(true);
}
function newQ(){
  const p=pool();cur=p[Math.random()*p.length|0];qt=Math.random()*3|0;answered=false;
  const seen=new Set([cur.m,cur.h]);const opts=[cur];
  for(const w of shuffle(words.filter(w=>w.c===cur.c)).concat(shuffle(words))){
    if(opts.length>=4)break;if(seen.has(w.m)||seen.has(w.h))continue;seen.add(w.m);seen.add(w.h);opts.push(w)
  }
  renderQ(shuffle(opts));
  if(qt===1)speak(cur.h)
}
function renderQ(opts){
  const zh=qt===2;
  let prompt;
  if(qt===0)prompt=`<div class="q">คำนี้แปลว่าอะไร</div><div class="hz ${cur.h.length>3?'sm':''}">${cur.h}</div>`;
  else if(qt===1)prompt=`<div class="q">ฟังเสียง แล้วเลือกความหมาย</div><button class="say" id="say" style="font-size:20px;padding:16px 28px">▶ เล่นเสียง</button>`;
  else prompt=`<div class="q">เลือกคำภาษาจีนที่ตรงกับความหมายนี้</div><div class="mn" style="font-size:28px;margin:0">${cur.m}</div>`;
  $('#stage').innerHTML=`
  <div class="score"><span>ถูก <b>${score}</b> จาก <b>${total}</b> ข้อ</span><span>ถูกติดต่อกัน <b>${streak}</b></span></div>
  <div class="card" style="min-height:220px">${prompt}<div class="fb" id="fb"></div></div>
  <div class="choices" id="ch">${opts.map((o,i)=>`<button class="${zh?'zh':''}" data-i="${i}">${zh?o.h:o.m}</button>`).join('')}</div>
  <button class="next" id="nx" style="display:none">ข้อต่อไป</button>`;
  const sb=$('#say');if(sb)sb.onclick=()=>speak(cur.h);
  $('#ch').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;total++;
    const ok=opts[+b.dataset.i]===cur;
    if(ok){score++;streak++}else streak=0;
    $('#ch').querySelectorAll('button').forEach(x=>{x.disabled=true;if(opts[+x.dataset.i]===cur)x.classList.add('ok')});
    if(!ok)b.classList.add('bad');
    $('#fb').innerHTML=`<div class="hz sm" style="font-size:44px">${cur.h}</div><div class="py">${cur.p}</div><div>อ่านว่า ${cur.t} หมายถึง ${cur.m}</div><div style="margin-top:6px;font-weight:600;color:var(${ok?'--jade':'--seal'})">${ok?'ถูกต้อง':'ยังไม่ถูก คำตอบคือคำที่ไฮไลต์สีเขียว'}</div>`;
    $('#nx').style.display='block';speak(cur.h);
    document.querySelector('.score').innerHTML=`<span>ถูก <b>${score}</b> จาก <b>${total}</b> ข้อ</span><span>ถูกติดต่อกัน <b>${streak}</b></span>`;
  });
  $('#nx').onclick=newQ;
}

const SENTENCES=[
 {zh:'我是学生。',py:'wǒ shì xuésheng',th:'ฉันเป็นนักเรียน',parts:['我','是','学生','。']},
 {zh:'你叫什么名字？',py:'nǐ jiào shénme míngzi',th:'คุณชื่ออะไร',parts:['你','叫','什么','名字','？']},
 {zh:'我喜欢喝茶。',py:'wǒ xǐhuan hē chá',th:'ฉันชอบดื่มชา',parts:['我','喜欢','喝','茶','。']},
 {zh:'他今天去学校。',py:'tā jīntiān qù xuéxiào',th:'วันนี้เขาไปโรงเรียน',parts:['他','今天','去','学校','。']},
 {zh:'我想买一杯咖啡。',py:'wǒ xiǎng mǎi yì bēi kāfēi',th:'ฉันอยากซื้อกาแฟหนึ่งแก้ว',parts:['我','想','买','一','杯','咖啡','。']},
 {zh:'请问，厕所在哪里？',py:'qǐngwèn, cèsuǒ zài nǎlǐ',th:'ขอถามหน่อย ห้องน้ำอยู่ที่ไหน',parts:['请问','，','厕所','在','哪里','？']},
 {zh:'这个多少钱？',py:'zhège duōshao qián',th:'อันนี้ราคาเท่าไร',parts:['这个','多少','钱','？']},
 {zh:'我听不懂中文。',py:'wǒ tīng bù dǒng Zhōngwén',th:'ฉันฟังภาษาจีนไม่เข้าใจ',parts:['我','听','不','懂','中文','。']},
 {zh:'明天我们去公园。',py:'míngtiān wǒmen qù gōngyuán',th:'พรุ่งนี้พวกเราไปสวนสาธารณะ',parts:['明天','我们','去','公园','。']},
 {zh:'你会说中文吗？',py:'nǐ huì shuō Zhōngwén ma',th:'คุณพูดภาษาจีนได้ไหม',parts:['你','会','说','中文','吗','？']},
 {zh:'我没有钱。',py:'wǒ méiyǒu qián',th:'ฉันไม่มีเงิน',parts:['我','没有','钱','。']},
 {zh:'今天天气很好。',py:'jīntiān tiānqì hěn hǎo',th:'วันนี้อากาศดีมาก',parts:['今天','天气','很','好','。']},
 {zh:'请给我一杯水。',py:'qǐng gěi wǒ yì bēi shuǐ',th:'กรุณาให้น้ำฉันหนึ่งแก้ว',parts:['请','给','我','一','杯','水','。']},
 {zh:'我们一起吃饭吧。',py:'wǒmen yìqǐ chīfàn ba',th:'พวกเรากินข้าวด้วยกันเถอะ',parts:['我们','一起','吃饭','吧','。']},
 {zh:'这个太贵了。',py:'zhège tài guì le',th:'อันนี้แพงเกินไป',parts:['这个','太','贵','了','。']}
];
let sentenceCur=null,sentenceBuilt=[],sentenceLocked=false,sentenceScore=0,sentenceTotal=0;
function newSentence(){
 sentenceCur=SENTENCES[Math.random()*SENTENCES.length|0];
 sentenceBuilt=[];sentenceLocked=false;
 const tokens=shuffle(sentenceCur.parts.map((v,i)=>({v,id:i})));
 $('#stage').innerHTML=`<div class="score"><span>ตอบถูก <b>${sentenceScore}</b> / <b>${sentenceTotal}</b></span><span>ฝึกเรียงคำให้เป็นประโยค</span></div>
 <div class="card" style="min-height:190px"><div class="q">เรียงคำภาษาจีนให้ถูกต้อง</div><div class="mn" style="font-size:20px">${sentenceCur.th}</div><div class="py" style="font-size:17px">${sentenceCur.py}</div></div>
 <p class="q" style="margin-top:14px">แตะคำด้านล่างตามลำดับประโยค</p>
 <div id="built" class="choices" style="display:flex;flex-wrap:wrap;gap:8px;min-height:54px"></div>
 <div id="tokens" class="choices" style="display:flex;flex-wrap:wrap;gap:8px"></div>
 <div class="row"><button id="undo">ย้อนคำ</button><button id="clear">เริ่มใหม่</button></div>
 <button class="next" id="check">ตรวจคำตอบ</button><div id="sfb" class="fb"></div>`;
 const draw=()=>{
  $('#built').innerHTML=sentenceBuilt.map(t=>`<button data-id="${t.id}">${t.v}</button>`).join('');
  $('#tokens').innerHTML=tokens.filter(t=>!sentenceBuilt.some(x=>x.id===t.id)).map(t=>`<button data-id="${t.id}">${t.v}</button>`).join('');
  $('#tokens').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!sentenceLocked){sentenceBuilt.push(tokens.find(t=>t.id===+b.dataset.id));draw()}});
  $('#built').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!sentenceLocked){sentenceBuilt=sentenceBuilt.filter(t=>t.id!==+b.dataset.id);draw()}});
 };
 draw();
 $('#undo').onclick=()=>{if(!sentenceLocked){sentenceBuilt.pop();draw()}};
 $('#clear').onclick=()=>{if(!sentenceLocked){sentenceBuilt=[];draw();$('#sfb').textContent=''}};
 $('#check').onclick=()=>{
  if(sentenceLocked)return;
  if(sentenceBuilt.length!==sentenceCur.parts.length){$('#sfb').textContent='ยังเรียงไม่ครบ ลองตรวจดูอีกครั้ง';return}
  sentenceLocked=true;sentenceTotal++;
  const ok=sentenceBuilt.map(t=>t.v).join('')===sentenceCur.parts.join('');
  if(ok)sentenceScore++;
  $('#sfb').innerHTML=`<b style="color:var(${ok?'--jade':'--seal'})">${ok?'ถูกต้อง เก่งมาก!':'ยังไม่ถูก ลองดูประโยคที่ถูกต้อง'}</b><div class="hz sm" style="font-size:32px;margin-top:8px">${sentenceCur.zh}</div><div class="py">${sentenceCur.py}</div><div>${sentenceCur.th}</div>`;
  $('.score').innerHTML=`<span>ตอบถูก <b>${sentenceScore}</b> / <b>${sentenceTotal}</b></span><span>ฝึกเรียงคำให้เป็นประโยค</span>`;
  $('#check').textContent='ประโยคถัดไป';$('#check').onclick=newSentence;
 };
}
function setMode(m){mode=m;$('#tLearn').classList.toggle('on',m==='learn');$('#tQuiz').classList.toggle('on',m==='quiz');$('#tList').classList.toggle('on',m==='list');$('#tSentence').classList.toggle('on',m==='sentence');$('#chips').style.display=m==='sentence'?'none':'flex';hist=[];start()}

$('#tList').onclick=()=>setMode('list');
$('#tLearn').onclick=()=>setMode('learn');
$('#tQuiz').onclick=()=>setMode('quiz');
$('#tSentence').onclick=()=>setMode('sentence');
renderChips();start();
</script>
