*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font:700 22px/1.2 "Noto Serif SC","Noto Sans Thai",serif;margin:0}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}

.card::after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;background:var(--seal);border-radius:2px}

.hz.sm{font-size:clamp(40px,14vw,64px)}
.py{font-size:24px;color:var(--jade);font-weight:600;margin-top:10px}
.th{font-size:20px;margin-top:4px}

.ans{transition:opacity .2s,filter .2s}
.card.veil .ans{opacity:0;filter:blur(8px);pointer-events:none}
.card.veil::before{content:"แตะการ์ดเพื่อดูคำตอบ";position:absolute;bottom:18px;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;margin-top:12px}

.q{font-size:15px;color:var(--mute);margin-bottom:8px}
.choices{display:grid;gap:10px;margin-top:12px}

.next{display:block;width:100%;margin-top:12px}
.fb{margin-top:14px;font-size:15px}

.it{display:grid;grid-template-columns:minmax(64px,36%) 1fr 40px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.it .zh{font:700 26px/1.2 "Noto Serif SC","Songti SC",serif;word-break:keep-all}
.it .p{color:var(--jade);font-weight:600}
.it .t{font-size:14px;color:var(--mute)}
.it button{border:0;background:var(--jade-t);color:var(--jade);border-radius:50%;width:36px;height:36px;cursor:pointer}
.hz.xs{font-size:clamp(26px,8vw,40px);word-break:normal;line-height:1.3}
.it .zh.long{font-size:18px;word-break:normal}
.choices button.zh.sm{font-size:20px}
.row button:disabled{opacity:.45;cursor:default}
.slots{min-height:76px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;background:var(--card)}
.slots.done{border-style:solid;border-color:var(--jade)}
.bank{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;align-items:center}
.ph{color:var(--mute);font-size:14px;margin:0 auto}
.tile{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:48px;min-height:48px;font-family:inherit}
.tile .zh{font:700 24px/1.25 "Noto Serif SC","Songti SC","SimSun",serif}
.tile .tp{font-size:12px;color:var(--jade);font-weight:600}
.slots .tile{border-color:var(--jade);background:var(--jade-t)}
.tile.bad{border-color:var(--seal)!important;background:var(--seal-t)!important}
.tile:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){.ans{transition:none}}

</head>

  const[th,tk,...alts]=l.split('|');

let cat='ทั้งหมด',sCat='ทั้งหมด',mode='learn',cur=null,hist=[],hide=false,shown=false,slow=false,score=0,total=0,streak=0,answered=false,qt=0,lastQ=null;
const pool=()=>words.filter(w=>cat==='ทั้งหมด'||w.c===cat);
const sPool=()=>sents.filter(s=>sCat==='ทั้งหมด'||s.c===sCat);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/v/g,'u');

let voice=null;
function pickVoice(){if(!hasTTS)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

function updateCount(){$('#count').textContent=mode==='sent'?sPool().length+' ประโยค':pool().length+' คำ'}

  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(mode==='sent')sCat=b.dataset.c;else cat=b.dataset.c;hist=[];renderChips();start()});

}
function renderList(){
  const cs=cat==='ทั้งหมด'?cats:[cat];

  words.forEach(w=>{if(!w.k){w.k=norm(w.h+' '+w.p+' '+w.t+' '+w.m);w.k2=w.k.replace(/[\s’']/g,'')}});

    $('#lst').innerHTML=cs.map(c=>{const ws=words.filter(w=>w.c===c&&(!q||w.k.includes(q)||w.k2.includes(q2)));
      return ws.length?`<h2>${c}<span>${ws.length} คำ</span></h2>`+ws.map(w=>`<div class="it" data-h="${w.h}"><b class="zh${w.h.length>4?' long':''}" lang="zh-CN">${w.h}</b><div><div class="p">${w.p}</div><div class="t">${w.t} – ${w.m}</div></div><button aria-label="ฟังเสียง ${w.h}">▶</button></div>`).join(''):''}).join('')||'<p class="note">ไม่พบคำที่ค้นหา</p>';

function start(){updateCount();if(mode==='learn')nextWord(false);else if(mode==='quiz')newQ();else if(mode==='sent')newS();else renderList()}
function nextWord(say=true){
  const p=pool();let w;do{w=p[Math.random()*p.length|0]}while(p.length>1&&cur&&w===cur);
  if(cur)hist.push(cur);cur=w;shown=false;renderLearn();if(say)speak(cur.h)
}
function renderLearn(){
  const w=cur,veil=hide&&!shown;

  const reveal=()=>{if(veil){shown=true;renderLearn();const c=$('#card');if(c)c.focus()}};
  $('#hide').onchange=e=>{hide=e.target.checked;shown=false;renderLearn()};
  $('#card').onclick=e=>{if(e.target.id==='say')return;reveal()};

  $('#say').onclick=()=>speak(w.h);
  $('#slow').onclick=()=>{slow=!slow;$('#slow').classList.toggle('on',slow);speak(w.h)};
  $('#prev').onclick=()=>{if(hist.length){cur=hist.pop();shown=false;renderLearn();speak(cur.h)}};
  $('#rnd').onclick=()=>nextWord(true);
}
function newQ(){
  const p=pool();let c;do{c=p[Math.random()*p.length|0]}while(p.length>1&&c===lastQ);
  cur=c;lastQ=c;qt=Math.random()*3|0;if(qt===1&&!hasTTS)qt=0;answered=false;
  const opts=[cur];
  for(const w of shuffle(words.filter(w=>w.c===cur.c)).concat(shuffle(words))){
    if(opts.length>=4)break;if(opts.some(o=>clash(o,w,qt===1)))continue;opts.push(w)
  }
  renderQ(shuffle(opts));
  if(qt===1)speak(cur.h)
}
function renderQ(opts){
  const zh=qt===2;
  let prompt;
  if(qt===0)prompt=`<div class="q">คำนี้แปลว่าอะไร</div><div class="hz ${hzc(cur.h)}" lang="zh-CN">${cur.h}</div>`;
  else if(qt===1)prompt=`<div class="q">ฟังเสียง แล้วเลือกความหมาย</div><button class="say" id="say" style="font-size:20px;padding:16px 28px">▶ เล่นเสียง</button>`;
  else prompt=`<div class="q">เลือกคำภาษาจีนที่ตรงกับความหมายนี้</div><div class="mn" style="font-size:28px;margin:0">${cur.m}</div>`;
  $('#stage').innerHTML=`
  <div class="score"><span>ถูก <b>${score}</b> จาก <b>${total}</b> ข้อ</span><span>ถูกติดต่อกัน <b>${streak}</b></span></div>
  <div class="card" style="min-height:220px">${prompt}<div class="fb" id="fb" aria-live="polite"></div></div>
  <div class="choices" id="ch">${opts.map((o,i)=>`<button ${zh?'lang="zh-CN" ':''}class="${zh?'zh'+(o.h.length>4?' sm':''):''}" data-i="${i}">${zh?o.h:o.m}</button>`).join('')}</div>
  <button class="next" id="nx" style="display:none">ข้อต่อไป</button>`;
  const sb=$('#say');if(sb)sb.onclick=()=>speak(cur.h);
  $('#ch').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;total++;
    const ok=opts[+b.dataset.i]===cur;
    if(ok){score++;streak++}else streak=0;
    $('#ch').querySelectorAll('button').forEach(x=>{x.disabled=true;if(opts[+x.dataset.i]===cur)x.classList.add('ok')});
    if(!ok)b.classList.add('bad');
    $('#fb').innerHTML=`<div class="hz sm" lang="zh-CN" style="font-size:${cur.h.length>4?28:44}px">${cur.h}</div><div class="py">${cur.p}</div><div>อ่านว่า ${cur.t} หมายถึง ${cur.m}</div><div style="margin-top:6px;font-weight:600;color:var(${ok?'--jade':'--seal'})">${ok?'ถูกต้อง':'ยังไม่ถูก คำตอบคือคำที่ไฮไลต์สีเขียว'}</div>`;
    $('#nx').style.display='block';$('#nx').focus();speak(cur.h);
    document.querySelector('.score').innerHTML=`<span>ถูก <b>${score}</b> จาก <b>${total}</b> ข้อ</span><span>ถูกติดต่อกัน <b>${streak}</b></span>`;
  });
  $('#nx').onclick=newQ;
}

let sCur=null,bank=[],ans=[],sState='play',sCounted=false,sScore=0,sTotal=0,sStreak=0,showPy=true,decoy=false,lastS=null,wrongSet=[];
const tileById=id=>bank.find(t=>t.id===id);
const tileHTML=(t,c='')=>`<button class="tile ${c}" data-id="${t.id}" lang="zh-CN"><span class="zh">${t.h}</span>${showPy?`<span class="tp">${t.p}</span>`:''}</button>`;
function newS(){
  const p=sPool();let s;do{s=p[Math.random()*p.length|0]}while(p.length>1&&s===lastS);
  sCur=s;lastS=s;ans=[];sState='play';sCounted=false;wrongSet=[];
  const tiles=s.t.map((t,i)=>({id:i,h:t.h,p:t.p,d:false}));
  if(decoy){
    const have=new Set(s.t.map(t=>t.h)),seen=new Set();
    const cand=shuffle([].concat(...sents.filter(x=>x!==s).map(x=>x.t)));
    let n=tiles.length>=5?2:1,k=100;
    for(const t of cand){if(!n)break;if(have.has(t.h)||seen.has(t.h))continue;seen.add(t.h);tiles.push({id:k++,h:t.h,p:t.p,d:true});n--}
  }
  let tries=0;do{bank=shuffle(tiles);tries++}while(tries<30&&s.ok.includes(bank.filter(t=>!t.d).map(t=>t.h).join(' ')));
  renderS();
}
function renderS(){
  $('#stage').innerHTML=`
  <div class="score" id="sc"></div>
  <label class="opt"><input type="checkbox" id="optpy" ${showPy?'checked':''}> แสดงพินอินบนปุ่มคำ</label>

  $('#optpy').onchange=e=>{showPy=e.target.checked;drawS()};
  $('#optdc').onchange=e=>{decoy=e.target.checked;newS()};
  $('#clr').onclick=()=>{ans=[];wrongSet=[];$('#fb').innerHTML='';drawS()};

function drawS(focusId){
  const inAns=new Set(ans),lock=sState!=='play';
  $('#sc').innerHTML=`<span>ถูกตั้งแต่ครั้งแรก <b>${sScore}</b> จาก <b>${sTotal}</b> ข้อ</span><span>ติดต่อกัน <b>${sStreak}</b></span>`;
  const sl=$('#slots');sl.className='slots'+(sState==='ok'?' done':'');
  sl.innerHTML=ans.length?ans.map((id,i)=>tileHTML(tileById(id),(wrongSet.includes(i)?'bad':'')+(sState==='ok'?' ok':''))).join(''):'<span class="ph">แตะคำด้านล่างเพื่อเริ่มเรียง</span>';
  $('#bank').innerHTML=bank.filter(t=>!inAns.has(t.id)).map(t=>tileHTML(t)).join('')||'<span class="ph">ใช้คำครบแล้ว</span>';
  document.querySelectorAll('#slots .tile,#bank .tile').forEach(b=>{b.disabled=lock;b.onclick=()=>{
    const id=+b.dataset.id;wrongSet=[];$('#fb').innerHTML='';
    if(ans.includes(id))ans=ans.filter(x=>x!==id);else ans.push(id);
    drawS(id)}});
  $('#chk').textContent=sState==='play'?'ตรวจคำตอบ':'ข้อต่อไป';
  $('#chk').disabled=sState==='play'&&!ans.length;
  $('#rvl').disabled=lock;
  $('#clr').disabled=lock||!ans.length;
  if(focusId!=null){const f=document.querySelector(`.tile[data-id="${focusId}"]`);if(f)f.focus()}
}
function countS(ok){if(sCounted)return;sCounted=true;sTotal++;if(ok){sScore++;sStreak++}else sStreak=0}
function showAnswer(ok){
  const ts=ans.map(tileById),f=ts.map(t=>t.h).join(''),py=ts.map(t=>t.p).join(' ');
  const alts=sCur.ok.map(v=>v.split(' ').join('')).filter(v=>v!==f);
  $('#fb').innerHTML=`<div class="hz" lang="zh-CN" style="font-size:${f.length>8?24:34}px;word-break:normal">${f}</div><div class="py" style="font-size:18px">${py}</div><div>${sCur.th}</div>
  <div style="margin-top:6px;font-weight:600;color:var(${ok?'--jade':'--seal'})">${ok?'ถูกต้อง':'เฉลย'}</div>
  ${alts.length?`<div class="note" style="margin-top:6px">เรียงได้อีกแบบ: <span lang="zh-CN">${alts.join(' / ')}</span></div>`:''}
  <button class="say" id="say2">▶ ฟังเสียง</button>`;

function checkS(){

  if(ok){sState='ok';wrongSet=[];drawS();showAnswer(true);speak(hz.join(''));$('#chk').focus();return}
  let best=sCur.ok[0].split(' '),bs=-1;
  sCur.ok.forEach(v=>{const a=v.split(' '),n=a.reduce((c,w,i)=>c+(hz[i]===w?1:0),0);if(n>bs){bs=n;best=a}});
  wrongSet=hz.map((w,i)=>w===best[i]?-1:i).filter(i=>i>=0);
  drawS();
  $('#fb').innerHTML=`<div style="color:var(--seal);font-weight:600">${ans.length<best.length&&!wrongSet.length?'ยังใส่คำไม่ครบ':'ยังไม่ถูก'}${wrongSet.length?' คำที่ขอบสีแดงอยู่ผิดตำแหน่งหรือไม่ต้องใช้':''}</div><div class="note" style="margin-top:6px;text-align:left">แตะคำเพื่อเอาออก แล้วเรียงใหม่ หรือกด "ดูเฉลย"</div>`;
}
function revealS(){
  if(sState!=='play')return;
  countS(false);sState='rev';wrongSet=[];
  const used=new Set();
  ans=sCur.ok[0].split(' ').map(w=>{const t=bank.find(x=>!x.d&&x.h===w&&!used.has(x.id));used.add(t.id);return t.id});
  drawS();showAnswer(false);$('#chk').focus();
}
/* ---------- แท็บ ---------- */
const TABS={learn:'#tLearn',quiz:'#tQuiz',sent:'#tSent',list:'#tList'};
function setMode(m){
  mode=m;if(hasTTS)try{speechSynthesis.cancel()}catch(e){}
  for(const k in TABS){const b=$(TABS[k]);b.classList.toggle('on',k===m);b.setAttribute('aria-selected',k===m)}
  hist=[];renderChips();start()
}
for(const k in TABS)$(TABS[k]).onclick=()=>setMode(k);
renderChips();start();
</script>
