<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จีนทุกวัน – ฝึกคำศัพท์และแต่งประโยคภาษาจีน</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>字</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{--bg:#edf1f3;--card:#fff;--ink:#12232b;--mute:#5d707a;--line:#cbd5da;--jade:#0e7c66;--jade-t:#dff3ee;--seal:#c23b2e;--seal-t:#fbe6e3;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b21;--card:#17272f;--ink:#e6eef1;--mute:#93a7b0;--line:#2a3e47;--jade:#3cc3a3;--jade-t:#16372f;--seal:#f06b5b;--seal-t:#3a1f1c;--on:#0f1b21}}
:root[data-theme="dark"]{--bg:#0f1b21;--card:#17272f;--ink:#e6eef1;--mute:#93a7b0;--line:#2a3e47;--jade:#3cc3a3;--jade-t:#16372f;--seal:#f06b5b;--seal-t:#3a1f1c;--on:#0f1b21}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font:700 22px/1.2 "Noto Serif SC","Noto Sans Thai",serif;margin:0}
h1 small{font:400 13px "Noto Sans Thai",sans-serif;color:var(--mute);margin-left:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mute);padding:10px 0;border-radius:9px;font:600 14px "Noto Sans Thai",sans-serif;cursor:pointer}
.tabs button.on{background:var(--jade);color:var(--on)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:400 14px "Noto Sans Thai",sans-serif;cursor:pointer}
.chips button.on{border-color:var(--jade);background:var(--jade-t);color:var(--jade);font-weight:600}
.opt{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin:4px 0 12px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.card::after{content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;background:var(--seal);border-radius:2px}
.hz{font:700 clamp(56px,20vw,104px)/1.1 "Noto Serif SC","Songti SC","SimSun",serif;word-break:keep-all}
.hz.sm{font-size:clamp(40px,14vw,64px)}
.py{font-size:24px;color:var(--jade);font-weight:600;margin-top:10px}
.th{font-size:20px;margin-top:4px}
.mn{font-size:20px;margin-top:8px;padding:6px 16px;background:var(--seal-t);color:var(--seal);border-radius:10px;font-weight:600}
.ans{transition:opacity .2s,filter .2s}
.card.veil .ans{opacity:0;filter:blur(8px);pointer-events:none}
.card.veil::before{content:"แตะการ์ดเพื่อดูคำตอบ";position:absolute;bottom:18px;color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;margin-top:12px}
.row button,.next{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px 10px;font:600 16px "Noto Sans Thai",sans-serif;cursor:pointer}
.row button.main,.next{background:var(--jade);border-color:var(--jade);color:var(--on)}
.row button.on{border-color:var(--jade);color:var(--jade)}
button:focus-visible,input:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.say{border:0;background:var(--jade-t);color:var(--jade);border-radius:999px;padding:10px 20px;font:600 16px "Noto Sans Thai",sans-serif;cursor:pointer;margin-top:12px}
.q{font-size:15px;color:var(--mute);margin-bottom:8px}
.choices{display:grid;gap:10px;margin-top:12px}
.choices button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font:600 18px "Noto Sans Thai",sans-serif;cursor:pointer;text-align:center}
.choices button.zh{font:700 30px "Noto Serif SC",serif}
.choices button.ok{border-color:var(--jade);background:var(--jade-t);color:var(--jade)}
.choices button.bad{border-color:var(--seal);background:var(--seal-t);color:var(--seal)}
.choices button:disabled{cursor:default}
.score{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:10px}
.score b{color:var(--ink)}
.next{display:block;width:100%;margin-top:12px}
.fb{margin-top:14px;font-size:15px}
.fb .py{font-size:20px;margin-top:0}
.note{margin-top:22px;color:var(--mute);font-size:13px;text-align:center}
#q{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:400 16px "Noto Sans Thai",sans-serif;margin-bottom:6px}
#lst h2{font:700 17px "Noto Sans Thai",sans-serif;margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--jade)}
#lst h2 span{font-weight:400;font-size:13px;color:var(--mute);margin-left:6px}
.it{display:grid;grid-template-columns:minmax(64px,36%) 1fr 40px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.it .zh{font:700 26px/1.2 "Noto Serif SC","Songti SC",serif;word-break:keep-all}
.it .p{color:var(--jade);font-weight:600}
.it .t{font-size:14px;color:var(--mute)}
.it button{border:0;background:var(--jade-t);color:var(--jade);border-radius:50%;width:36px;height:36px;cursor:pointer}
.hz.xs{font-size:clamp(26px,8vw,40px);word-break:normal;line-height:1.3}
.it .zh.long{font-size:18px;word-break:normal}
.choices button.zh.sm{font-size:20px}
.row button:disabled{opacity:.45;cursor:default}
.slots{min-height:76px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;background:var(--card)}
.slots.done{border-style:solid;border-color:var(--jade)}
.bank{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;align-items:center}
.ph{color:var(--mute);font-size:14px;margin:0 auto}
.tile{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:48px;min-height:48px;font-family:inherit}
.tile .zh{font:700 24px/1.25 "Noto Serif SC","Songti SC","SimSun",serif}
.tile .tp{font-size:12px;color:var(--jade);font-weight:600}
.slots .tile{border-color:var(--jade);background:var(--jade-t)}
.tile.bad{border-color:var(--seal)!important;background:var(--seal-t)!important}
.tile:disabled{cursor:default}
#lbar{margin-bottom:10px}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.lhead button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px "Noto Sans Thai",sans-serif;cursor:pointer;flex:none}
.ltitle{font-weight:700;line-height:1.25}
.lsub{font-size:13px;color:var(--mute)}
.lsteps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.lsteps button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:9px 4px;font:600 13px "Noto Sans Thai",sans-serif;cursor:pointer}
.lsteps button.on{background:var(--jade);border-color:var(--jade);color:var(--on)}
.ovw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.ovt{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ovt span{color:var(--mute);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--jade);border-radius:99px}
.rvbtn{width:100%;border:1px dashed var(--jade);background:var(--jade-t);color:var(--jade);border-radius:12px;padding:12px;font:600 15px "Noto Sans Thai",sans-serif;cursor:pointer;margin-bottom:4px}
.rvbtn:disabled{opacity:.5;cursor:default}
.lvh{font:700 17px "Noto Sans Thai",sans-serif;margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--jade)}
.lvh span{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font-family:inherit}
.lrow.next{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-t)}
.lrow .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--jade-t);color:var(--jade);display:grid;place-items:center;font-weight:700}
.lrow.pass .no{background:var(--jade);color:var(--on)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;line-height:1.3}
.lrow .lt small{color:var(--mute);font-size:13px}
.lrow .st{flex:none;font-size:12px;font-weight:600;color:var(--mute);text-align:right}
.lrow .st.ok{color:var(--jade)}
.stp{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-size:14px;color:var(--mute)}
.lnk{border:0;background:none;color:var(--jade);font:600 14px "Noto Sans Thai",sans-serif;cursor:pointer;text-decoration:underline;padding:4px}
.exs{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--jade-t);font-size:15px;max-width:100%}
.exs .zh{font:700 20px/1.4 "Noto Serif SC","Songti SC",serif}
.exs small{display:block;color:var(--jade);font-weight:600}
.rw{font:700 16px "Noto Sans Thai",sans-serif;margin:18px 0 6px}
.rwi{display:flex;gap:10px;align-items:baseline;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.rwi .zh{font:700 22px "Noto Serif SC",serif}
.rwi .py{font-size:15px;margin:0}
.row.wr{flex-wrap:wrap}
.cvopts{display:flex;flex-wrap:wrap;gap:4px 14px;margin:2px 0 8px;font-size:14px;color:var(--mute)}
.cvopts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.sit{background:var(--jade-t);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:8px}
.menuP{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:8px 0}
.menuP summary{font-weight:700;cursor:pointer;padding:4px 0}
.menuP .mh{font-weight:700;color:var(--jade);margin:12px 0 4px;font-size:14px}
.mi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px dashed var(--line);cursor:pointer}
.mi .mz{font:700 19px/1.3 "Noto Serif SC","Songti SC",serif}
.mi .mp{font-weight:700;white-space:nowrap}
.mi small{display:block;font-size:13px;color:var(--mute);font-weight:400;font-family:"Noto Sans Thai",sans-serif}
.mi small b{color:var(--jade);font-weight:600}
#cvlog{margin:6px 0}
.bub{max-width:90%;padding:9px 14px 10px;border-radius:16px;margin:8px 0;position:relative}
.bub.l{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;margin-right:auto}
.bub.r{background:var(--jade-t);border:1px solid var(--jade);border-bottom-right-radius:4px;margin-left:auto}
.bub .who{font-size:12px;color:var(--mute)}
.bub .zh{font:700 20px/1.45 "Noto Serif SC","Songti SC",serif}
.bub .p{color:var(--jade);font-weight:600;font-size:14px}
.bub .t{color:var(--mute);font-size:14px}
.bub .sp{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--jade);font-size:14px;cursor:pointer;padding:4px}
.bub .zh{padding-right:22px}
.nar{text-align:center;color:var(--mute);font-size:13px;margin:12px 0}
.qres{font-size:14px;border-left:4px solid var(--jade);padding:4px 10px;margin:8px 0;color:var(--mute)}
.qres.bad{border-color:var(--seal)}
.qres b{color:var(--ink)}
.sign{background:var(--jade);color:var(--on);border:4px solid var(--card);outline:2px solid var(--jade);font:700 clamp(30px,10vw,52px)/1.25 "Noto Serif SC","Songti SC",serif;text-align:center;padding:26px 14px;border-radius:12px;margin:8px 0 12px;word-break:normal}
.sign.long{font-size:clamp(22px,6.5vw,34px)}
.cvc{display:grid;gap:8px;margin-top:10px}
.cvc button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:600 16px "Noto Sans Thai",sans-serif;cursor:pointer;text-align:left}
.cvc button.ok{border-color:var(--jade);background:var(--jade-t);color:var(--jade)}
.cvc button.bad{border-color:var(--seal);background:var(--seal-t);color:var(--seal)}
.cvc button:disabled{cursor:default}
.gl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.gl .zh{font:700 20px "Noto Serif SC",serif;grid-row:span 2;align-self:center}
.gl .p{color:var(--jade);font-weight:600;font-size:14px}
.gl .t{color:var(--mute);font-size:14px}
@media (prefers-reduced-motion:reduce){.ans{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>จีนทุกวัน<small>汉语日常词</small></h1><span id="count" style="color:var(--mute);font-size:14px"></span></header>
  <div class="tabs" role="tablist">
    <button id="tLesson" class="on" role="tab" aria-selected="true">บทเรียน</button>
    <button id="tConvo" role="tab" aria-selected="false">สนทนา</button>
    <button id="tLearn" role="tab" aria-selected="false">ฝึกจำคำ</button>
    <button id="tQuiz" role="tab" aria-selected="false">ทดสอบ</button>
    <button id="tSent" role="tab" aria-selected="false">แต่งประโยค</button>
    <button id="tList" role="tab" aria-selected="false">รายการคำ</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="lbar" style="display:none"></div>
  <div id="stage"></div>
  <p class="note">เสียงอ่านใช้เสียงภาษาจีนของเครื่อง หากไม่มีเสียง ให้เพิ่มภาษาจีน (Mandarin) ในการตั้งค่าเสียงของอุปกรณ์<br>คำอ่านไทยเป็นการประมาณเสียง ให้ยึดพินอินเป็นหลัก · 不 และ 一 เปลี่ยนเสียงตามคำที่ตามมา เช่น 不是 อ่านว่า bú shì, 一个 อ่านว่า yí ge</p>
</div>

  const t=CV.cur;
  if(t.k==='U'){const ts=CV.ans.map(cvTileById);CV.log.push({k:'Y',zh:ts.map(x=>x.h).join(''),py:ts.map(x=>x.p).join(' '),th:t.th})}
  CV.i++;cvAdvance();
}
function cvSummary(el){
  const sc=CV.sc,n=cvN(sc),pct=n?Math.round(CV.first/n*100):100,nx=convos.find(c=>c.id===sc.id+1);
  const gl=sc.gloss.filter(g=>!byH.has(g.h));
  el.innerHTML=`<div class="card" style="min-height:0"><div class="q">จบฉากนี้</div><div class="hz" style="font-size:64px">${pct}%</div><div class="th">ตอบถูกตั้งแต่ครั้งแรก ${CV.first} จาก ${n} โจทย์</div><div class="mn">${pct>=80?'เยี่ยมมาก':'ลองทำอีกรอบให้คล่องขึ้นนะ'}</div></div>
  ${gl.length?`<h2 class="rw">คำและวลีใหม่ในฉากนี้</h2>`+gl.map(g=>`<div class="gl" data-h="${g.h}"><span class="zh" lang="zh-CN">${g.h}</span><span class="p">${g.p}</span><span class="t">${g.t}</span></div>`).join(''):''}
  <div class="row wr" style="margin-top:12px">${hasTTS&&sc.type==='chat'?'<button id="cvplay">▶ ฟังทั้งบทสนทนา</button>':''}<button id="cvagain">ทำซ้ำ</button><button id="cvlist">รายการฉาก</button>${nx?'<button class="main" id="cvnext">ฉากถัดไป</button>':''}</div>`;
  el.querySelectorAll('.gl').forEach(e=>e.onclick=()=>speak(e.dataset.h));
  const p=$('#cvplay');if(p)p.onclick=()=>speakQ(CV.log.filter(e=>e.k==='S'||e.k==='Y').map(e=>e.zh));
  $('#cvagain').onclick=()=>openConvo(sc.id);
  $('#cvlist').onclick=()=>{if(hasTTS)try{speechSynthesis.cancel()}catch(e){}renderConvoList();window.scrollTo(0,0)};
  const nb=$('#cvnext');if(nb)nb.onclick=()=>openConvo(nx.id);
}
/* ---------- แท็บ ---------- */
const TABS={lesson:'#tLesson',convo:'#tConvo',learn:'#tLearn',quiz:'#tQuiz',sent:'#tSent',list:'#tList'};
function setMode(m){
  mode=m;sFilter=null;LS.id=null;CV.sc=null;$('#lbar').style.display='none';if(hasTTS)try{speechSynthesis.cancel()}catch(e){}
  for(const k in TABS){const b=$(TABS[k]);b.classList.toggle('on',k===m);b.setAttribute('aria-selected',k===m)}
  hist=[];renderChips();start()
}
for(const k in TABS)$(TABS[k]).onclick=()=>setMode(k);
renderChips();start();
</script>
